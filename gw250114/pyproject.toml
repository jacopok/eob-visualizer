[project]
name = "gw250114-blender"
version = "0.1.0"
description = "Blender visualization of GW250114 SEOBNRv5PHM posterior dynamics"
requires-python = ">=3.10,<3.11"
# versions pinned to those used for the SEOBNRv5PHM parameter estimation run
dependencies = [
    "pyseobnr==0.3.5",
    "lalsuite==7.26",
    "bilby==2.6.0",
    "bilby_pipe==1.6.0",
    "gwpy==3.0.11",
    "numpy==1.24.4",
    "scipy==1.13.1",
    "h5py",
    "matplotlib",
    "corner>=2.3.0",
]

[tool.uv]
package = false
# pygsl-lite and pyseobnr are built from sdists: recent setuptools breaks pygsl-lite,
# and pyseobnr must be compiled against the same scipy/numpy used at runtime
build-constraint-dependencies = ["setuptools>=78,<80", "scipy==1.13.1", "numpy==1.24.4"]
